[package]
name = "reader-tauri"
version = "1.2.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"
fs2 = "0.4"
sha2 = "0.10"
tempfile = "3"
