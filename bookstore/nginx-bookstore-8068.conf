server {
    listen 8068 ssl;
    listen [::]:8068 ssl;
    server_name huijuguangnian.top www.huijuguangnian.top;
    ssl_certificate /etc/nginx/ssl/huijuguangnian.top/huijuguangnian.top_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/huijuguangnian.top/huijuguangnian.top.key;
    client_max_body_size 50M;
    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
