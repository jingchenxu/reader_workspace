server:
  port: 8002

spring:
  application:
    name: epub-reader-server
  
  datasource:
    url: jdbc:mysql://localhost:3306/bookstore?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: bookstore
    password: 7fCaYSPSDY6XekXX
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 900000
      keepalive-time: 300000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL5InnoDBDialect
  
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: YourSecretKeyForJWTTokenGenerationMustBeLongEnoughAndSecure2024
    expiration: 86400000
  
  file:
    upload-dir: ./uploads/books
    cover-upload-dir: ./uploads/covers
    max-size: 52428800

logging:
  level:
    com.bookstore: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
